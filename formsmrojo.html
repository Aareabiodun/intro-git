<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ojo Form</title>
</head>
<body>
    <form>
        <fieldset style="height:470px;">
            <legend>User Personal Information</legend>
            <label for="full name">Enter your full name</label><br>
            <input type="text" id="name" name="name" style="width:400px;"><br><br>
            <label for="email">Email</label><br>
            <input type="text" id="email" name="email" style="width: 400px;"> <br><br>
            <label for="password">Enter your Password</label><br>
            <input type="text" id="password" name="password" style="width: 400px;"><br><br>
            <label for="password">Confirm your Password</label><br>
            <input type="text" id="password" name="password" style="width: 400px;"><br><br>
            <label for="gender">Enter your gender</label><br>
            <label for="radio1">Male</label>
            <input type="radio" id="radio1" name="radio" value="option1" required>
            <label for="radio2">Female</label>
            <input type="radio" id="radio2" name="radio" value="option2" required>
            <label for="radio3">Others</label>
            <input type="radio" id="radio3" name="radio" value="option3" required><br><br>
            <label for="dob">Enter your Date of Birth</label><br>
            <input type="date" id="dob" name="dob" required><br><br>
            <label for="address">Enter your Address</label><br>
            <textarea id="address" name="address" rows="3" cols="40"></textarea><br><br>
            <input type="submit"  value="Submit">
        </fieldset>
    </form>
    
</body>
</html>
